<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScientoAI — Narrative CV</title>
  <meta name="description" content="Academic Narrative CV generated by ScientoAI." />

  <!-- Google Fonts: Inter & Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet" />

  <!-- marked.js for client-side Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    /* ============================================================
       SCIENTO AI — DESIGN TOKENS (mirrors utils/theme.R)
       ============================================================ */
    :root {
      --bordeaux-main:   #6B0F1A;
      --bordeaux-dark:   #4A0A12;
      --bordeaux-light:  #8E1626;
      --bordeaux-accent: #E53E50;
      --bg-app:          #F8F9FA;
      --bg-card:         #FFFFFF;
      --text-main:       #1D1D1F;
      --text-muted:      #6E6E73;
      --border-radius:   12px;
      --shadow-soft:     0 4px 20px rgba(0,0,0,0.05);
      --shadow-medium:   0 8px 30px rgba(0,0,0,0.08);
      --shadow-premium:  0 10px 40px rgba(0, 0, 0, 0.08);
    }

    /* ============================================================
       BASE LAYOUT
       ============================================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-main);
      background-color: var(--bg-app);
      -webkit-font-smoothing: antialiased;
      line-height: 1.6;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D1D1D6; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--bordeaux-main); }

    /* Fade-in Animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in {
      animation: fadeIn 0.5s ease-out forwards;
    }

    /* Page Wrapper */
    .cv-page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 36px 20px 80px;
    }

    /* ============================================================
       PROFILE HEADER CARD
       ============================================================ */
    .cv-profile-card {
      background: linear-gradient(135deg, #6B0F1A 0%, #a01c29 100%);
      border-radius: 16px;
      padding: 32px;
      color: #ffffff;
      margin-bottom: 28px;
      box-shadow: 0 4px 24px rgba(107, 15, 26, 0.28);
    }

    .cv-logo-line {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      opacity: 0.9;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .cv-logo-icon {
      width: 26px;
      height: 26px;
      background: rgba(255, 255, 255, 0.22);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
    }

    .cv-profile-card h1 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 2.1rem;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      color: #ffffff !important;
      border-bottom: none !important;
    }

    .cv-profile-card .cv-subtitle {
      font-size: 0.95rem;
      opacity: 0.88;
      font-weight: 400;
    }

    /* ============================================================
       THEMATIC RESEARCH AREAS (CLUSTER GRID)
       ============================================================ */
    .cv-cluster-section {
      margin-bottom: 32px;
    }

    .cv-cluster-section-title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 1.15rem;
      color: #222;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cv-cluster-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 18px;
    }

    .cv-cluster-card {
      background: var(--bg-card);
      border-radius: 12px;
      border: 1px solid #EAECEF;
      border-left: 5px solid var(--bordeaux-main) !important;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
      padding: 20px 18px;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .cv-cluster-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(107, 15, 26, 0.12);
    }

    .cv-cluster-card h3 {
      color: var(--bordeaux-main) !important;
      font-weight: 700;
      font-size: 1.02rem;
      margin-bottom: 8px;
      border-bottom: none !important;
      line-height: 1.35;
    }

    .cv-cluster-card p {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.55;
      margin-bottom: 12px;
      flex-grow: 1;
    }

    .cv-keyword-container {
      margin-top: 6px;
      margin-bottom: 8px;
    }

    .cv-keyword-badge {
      background: rgba(107, 15, 26, 0.08);
      color: var(--bordeaux-main);
      border: 1px solid rgba(107, 15, 26, 0.18);
      border-radius: 16px;
      padding: 2px 9px;
      font-size: 0.75rem;
      font-weight: 500;
      display: inline-block;
      margin: 2px;
      transition: background 0.15s ease;
    }

    .cv-keyword-badge:hover {
      background: var(--bordeaux-main);
      color: #fff;
    }

    .cv-pubs-container {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #f0f0f2;
    }

    .cv-pubs-header {
      font-size: 0.78rem;
      font-weight: 600;
      color: #555;
      margin-bottom: 4px;
    }

    .cv-pubs-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .cv-pubs-list li {
      font-size: 0.78rem;
      color: #444;
      padding: 3px 0;
      line-height: 1.4;
      display: flex;
      align-items: flex-start;
      gap: 5px;
    }

    .cv-pubs-list li::before {
      content: "📄";
      font-size: 0.72rem;
      flex-shrink: 0;
      margin-top: 2px;
    }

    /* ============================================================
       NARRATIVE CV TEXT CARD
       ============================================================ */
    .cv-narrative-card {
      border-radius: 16px;
      box-shadow: var(--shadow-premium);
      padding: 36px 40px;
      background: #ffffff;
      line-height: 1.85;
      border: 1px solid #EAECEF;
    }

    .cv-narrative-card-header {
      color: var(--bordeaux-main);
      font-size: 1.25rem;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      border-bottom: 2px solid #f0e6e8;
      padding-bottom: 12px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Markdown styling inside narrative card */
    .cv-narrative-card h1,
    .cv-narrative-card h2 {
      color: var(--bordeaux-main);
      border-bottom: 2px solid #f0e6e8;
      padding-bottom: 8px;
      margin-top: 32px;
      margin-bottom: 16px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
    }

    .cv-narrative-card h1 { font-size: 1.55rem; }
    .cv-narrative-card h2 { font-size: 1.28rem; }

    .cv-narrative-card h3 {
      color: #a01c29;
      font-size: 1.1rem;
      font-weight: 700;
      margin-top: 24px;
      margin-bottom: 12px;
    }

    .cv-narrative-card p {
      margin-bottom: 16px;
      color: #2c3e50;
      font-size: 0.96rem;
      text-align: justify;
    }

    .cv-narrative-card ul,
    .cv-narrative-card ol {
      padding-left: 24px;
      margin-bottom: 16px;
      color: #2c3e50;
    }

    .cv-narrative-card li {
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    .cv-narrative-card strong {
      color: var(--bordeaux-main);
      font-weight: 600;
    }

    .cv-narrative-card hr {
      border: none;
      border-top: 1px solid #f0e6e8;
      margin: 28px 0;
    }

    .cv-narrative-card blockquote {
      border-left: 4px solid var(--bordeaux-main);
      margin-left: 0;
      padding: 12px 18px;
      background: rgba(107, 15, 26, 0.04);
      border-radius: 0 8px 8px 0;
      color: var(--text-muted);
      font-style: italic;
      margin-bottom: 18px;
    }

    /* ============================================================
       RESPONSIVE DESIGN
       ============================================================ */
    @media (max-width: 768px) {
      .cv-page { padding: 20px 14px 60px; }
      .cv-profile-card { padding: 24px 20px; }
      .cv-profile-card h1 { font-size: 1.65rem; }
      .cv-cluster-grid { grid-template-columns: 1fr; }
      .cv-narrative-card { padding: 24px 18px; }
      .cv-narrative-card p { text-align: left; }
    }
  </style>
</head>

<body>
  <div class="cv-page fade-in">

    <!-- Profile Header Card -->
    <div class="cv-profile-card" id="profile-card">
      <div class="cv-logo-line">
        <div class="cv-logo-icon">⚛</div>
        <span>Sciento AI</span>
      </div>
      <h1 id="author-name">—</h1>
      <div class="cv-subtitle">Academic Narrative CV</div>
    </div>

    <!-- Thematic Research Areas -->
    <div class="cv-cluster-section" id="themes-section">
      <div class="cv-cluster-section-title">Thematic Research Areas</div>
      <div class="cv-cluster-grid" id="themes-grid">
        <!-- Populated dynamically by JS -->
      </div>
    </div>

    <!-- Academic Narrative CV -->
    <div class="cv-narrative-card">
      <div class="cv-narrative-card-header">📖 Academic Narrative CV</div>
      <div id="narrative-body">
        <!-- Populated dynamically by JS -->
      </div>
    </div>

  </div>

  <script>
    // Injected markdown content
    const RAW_MD = `{{MARKDOWN_CONTENT}}`;

    function parseMD(md) {
      const result = { title: "", themes: [], biography: "" };
      const normalized = md.replace(/\r\n/g, "\n");

      // 1. Extract Author Name
      const titleMatch = normalized.match(/^#\s+(.+)$/m);
      if (titleMatch) {
        result.title = titleMatch[1].replace(/^Narrative CV:\s*/i, "").trim();
      }

      // 2. Split on the hr separator (---) dividing themes and biography
      const hrIndex = normalized.indexOf("\n---\n");
      const themeSection = hrIndex !== -1 ? normalized.slice(0, hrIndex) : normalized;
      const bioSection = hrIndex !== -1 ? normalized.slice(hrIndex + 5) : "";

      // 3. Parse Themes
      const themeBlocks = themeSection.split(/^###\s+/m).slice(1);
      result.themes = themeBlocks.map(block => {
        const lines = block.split("\n");
        const name = lines[0].trim();
        const rest = lines.slice(1).join("\n");

        const kwMatch = rest.match(/\*\*Keywords\*\*:\s*([^\n]+)/i);
        const pubsMatch = rest.match(/\*\*Key Publications\*\*:\s*\n([\s\S]*?)(?=\n###|\n##|$)/i);

        let description = rest;
        if (kwMatch) {
          description = description.split(/\*\*Keywords\*\*:/i)[0];
        } else if (pubsMatch) {
          description = description.split(/\*\*Key Publications\*\*:/i)[0];
        }
        description = description.trim();

        const keywords = kwMatch
          ? kwMatch[1].split(",").map(k => k.trim()).filter(Boolean)
          : [];

        const pubs = pubsMatch
          ? pubsMatch[1].split("\n").map(l => l.replace(/^-\s*/, "").trim()).filter(Boolean)
          : [];

        return { name, description, keywords, pubs };
      });

      // 4. Biography section: remove the leading ## Academic Biography heading if present
      let bioBody = bioSection.replace(/^##\s+Academic Biography\s*\n/m, "").trim();
      result.biography = bioBody;

      return result;
    }

    function render(md) {
      const data = parseMD(md);

      // Set Author Name & Page Title
      const name = data.title || "Academic Profile";
      document.getElementById("author-name").textContent = name;
      document.title = "ScientoAI — " + name;

      // Render Themes Grid
      const grid = document.getElementById("themes-grid");
      const section = document.getElementById("themes-section");

      if (data.themes.length === 0) {
        section.style.display = "none";
      } else {
        grid.innerHTML = data.themes.map(t => `
          <div class="cv-cluster-card">
            <h3>${escHtml(t.name)}</h3>
            <p>${escHtml(t.description)}</p>
            ${t.keywords.length > 0 ? `
              <div class="cv-keyword-container">
                ${t.keywords.map(k => `<span class="cv-keyword-badge">${escHtml(k)}</span>`).join("")}
              </div>
            ` : ""}
            ${t.pubs.length > 0 ? `
              <div class="cv-pubs-container">
                <div class="cv-pubs-header">Key Publications:</div>
                <ul class="cv-pubs-list">
                  ${t.pubs.map(p => `<li>${escHtml(p)}</li>`).join("")}
                </ul>
              </div>
            ` : ""}
          </div>
        `).join("");
      }

      // Render Narrative Biography via marked
      if (typeof marked !== "undefined" && typeof marked.parse === "function") {
        document.getElementById("narrative-body").innerHTML = marked.parse(data.biography || "");
      } else {
        document.getElementById("narrative-body").textContent = data.biography || "";
      }
    }

    function escHtml(str) {
      if (!str) return "";
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Execute render
    render(RAW_MD);
  </script>
</body>
</html>
