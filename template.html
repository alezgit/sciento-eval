<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScientoAI — Narrative CV</title>
  <meta name="description" content="Academic Narrative CV generated by ScientoAI." />

  <!-- Google Fonts: Inter & Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet" />

  <!-- marked.js for client-side Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    /* ============================================================
       SCIENTO AI — DESIGN TOKENS (mirrors utils/theme.R)
       ============================================================ */
    :root {
      --bordeaux-main:   #6B0F1A;
      --bordeaux-dark:   #4A0A12;
      --bordeaux-light:  #8E1626;
      --bordeaux-accent: #E53E50;
      --bg-app:          #F8F9FA;
      --bg-card:         #FFFFFF;
      --border-subtle:   #EAECEF;
      --border-card:     #E2E6EA;
      --text-main:       #1D1D1F;
      --text-muted:      #5E6368;
      --text-light:      #80868B;
      --border-radius-sm: 8px;
      --border-radius-md: 12px;
      --border-radius-lg: 16px;
      --shadow-soft:     0 2px 12px rgba(0, 0, 0, 0.04);
      --shadow-medium:   0 6px 20px rgba(0, 0, 0, 0.07);
      --shadow-premium:  0 10px 36px rgba(0, 0, 0, 0.07);
      --shadow-hover:    0 10px 28px rgba(107, 15, 26, 0.14);
    }

    /* ============================================================
       BASE LAYOUT
       ============================================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-main);
      background-color: var(--bg-app);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      line-height: 1.65;
      overflow-x: hidden;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D1D1D6; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--bordeaux-main); }

    /* Fade-in Animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in {
      animation: fadeIn 0.45s ease-out forwards;
    }

    /* Page Wrapper */
    .cv-page {
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
      padding: 36px 24px 80px;
    }

    /* ============================================================
       PROFILE HEADER CARD
       ============================================================ */
    .cv-profile-card {
      background: linear-gradient(135deg, #6B0F1A 0%, #8E1626 55%, #a01c29 100%);
      border-radius: var(--border-radius-lg);
      padding: 34px 36px;
      color: #ffffff;
      margin-bottom: 28px;
      box-shadow: 0 8px 30px rgba(107, 15, 26, 0.25);
      position: relative;
      overflow: hidden;
    }

    .cv-profile-card::after {
      content: "";
      position: absolute;
      top: -40%;
      right: -10%;
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, rgba(255,255,255,0.09) 0%, rgba(255,255,255,0) 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .cv-logo-line {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      opacity: 0.92;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .cv-logo-icon {
      width: 26px;
      height: 26px;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
    }

    .cv-profile-card h1 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 2.15rem;
      letter-spacing: -0.6px;
      line-height: 1.25;
      margin-bottom: 8px;
      color: #ffffff !important;
      border-bottom: none !important;
    }

    .cv-profile-card .cv-subtitle {
      font-size: 0.98rem;
      opacity: 0.88;
      font-weight: 400;
      letter-spacing: 0.2px;
    }

    /* Bibliometric Overview inside Profile Card */
    .cv-bib-section {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.22);
    }

    .cv-bib-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    .cv-bib-stat-pill {
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 0.84rem;
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .cv-bib-stat-pill strong {
      color: #ffffff !important;
      font-weight: 700;
    }

    .cv-bib-venues-wrap {
      margin-top: 8px;
    }

    .cv-bib-toggle {
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 0.8rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s, transform 0.15s;
    }

    .cv-bib-toggle:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }

    .cv-bib-toggle .chevron {
      transition: transform 0.2s ease;
    }

    .cv-bib-toggle.open .chevron {
      transform: rotate(180deg);
    }

    .cv-bib-venues-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
      max-height: 250px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .cv-venue-chip {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.76rem;
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      line-height: 1.35;
    }

    .cv-venue-chip .chip-count {
      background: rgba(0, 0, 0, 0.25);
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 0.72rem;
      font-weight: 700;
      color: #ffffff;
    }
    .cv-cluster-section {
      margin-bottom: 38px;
    }

    .cv-cluster-section-title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 1.25rem;
      color: #1a1a1a;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .cv-cluster-section-title::before {
      content: "";
      display: inline-block;
      width: 4px;
      height: 18px;
      background: var(--bordeaux-main);
      border-radius: 2px;
    }

    .cv-cluster-stack {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .cv-cluster-card {
      background: var(--bg-card);
      border-radius: var(--border-radius-md);
      border: 1px solid var(--border-card);
      border-left: 5px solid var(--bordeaux-main) !important;
      box-shadow: var(--shadow-soft);
      padding: 26px 30px;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease, border-color 0.2s ease;
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .cv-cluster-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
      border-color: #d1d5db;
    }

    .cv-cluster-card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .cv-cluster-num {
      background: rgba(107, 15, 26, 0.08);
      color: var(--bordeaux-main);
      font-weight: 700;
      font-size: 0.8rem;
      font-family: 'Montserrat', sans-serif;
      padding: 4px 10px;
      border-radius: 6px;
      flex-shrink: 0;
      letter-spacing: 0.3px;
    }

    .cv-cluster-card h3 {
      color: var(--bordeaux-main) !important;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 1.15rem;
      margin: 0;
      border-bottom: none !important;
      line-height: 1.35;
      letter-spacing: -0.2px;
    }

    .cv-cluster-card p.cv-cluster-desc {
      font-size: 0.94rem;
      color: #2D3748;
      line-height: 1.7;
      margin-bottom: 16px;
      text-align: justify;
      text-justify: inter-word;
      hyphens: auto;
      -webkit-hyphens: auto;
    }

    .cv-keyword-section {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .cv-meta-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: #4A4A4F;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .cv-keyword-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      flex: 1;
    }

    .cv-keyword-badge {
      background: #FDF2F4;
      color: var(--bordeaux-main);
      border: 1px solid rgba(107, 15, 26, 0.15);
      border-radius: 14px;
      padding: 3px 11px;
      font-size: 0.78rem;
      font-weight: 500;
      line-height: 1.3;
      display: inline-block;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .cv-keyword-badge:hover {
      background: var(--bordeaux-main);
      color: #ffffff;
      border-color: var(--bordeaux-main);
    }

    .cv-pubs-container {
      margin-top: 10px;
      padding-top: 14px;
      border-top: 1px solid #f0f2f5;
    }

    .cv-pubs-header {
      font-size: 0.78rem;
      font-weight: 700;
      color: #4A4A4F;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .cv-pubs-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .cv-pubs-list li {
      font-size: 0.84rem;
      color: #4B5563;
      padding: 2px 0;
      line-height: 1.48;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .cv-pubs-list li::before {
      content: "📄";
      font-size: 0.76rem;
      flex-shrink: 0;
      margin-top: 2px;
      opacity: 0.85;
    }

    /* ============================================================
       NARRATIVE CV TEXT CARD
       ============================================================ */
    .cv-narrative-card {
      border-radius: var(--border-radius-lg);
      box-shadow: var(--shadow-premium);
      padding: 42px 48px;
      background: #ffffff;
      line-height: 1.85;
      border: 1px solid var(--border-card);
    }

    .cv-narrative-card-header {
      color: var(--bordeaux-main);
      font-size: 1.3rem;
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      border-bottom: 2px solid #F0E6E8;
      padding-bottom: 14px;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Markdown elements inside narrative card */
    .cv-narrative-card h1 {
      color: var(--bordeaux-main);
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 1.65rem;
      letter-spacing: -0.4px;
      border-bottom: 2px solid #F0E6E8;
      padding-bottom: 10px;
      margin-top: 36px;
      margin-bottom: 18px;
    }

    .cv-narrative-card h2 {
      color: var(--bordeaux-main);
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 1.35rem;
      letter-spacing: -0.3px;
      border-bottom: 1px solid #F0E6E8;
      padding-bottom: 8px;
      margin-top: 32px;
      margin-bottom: 16px;
    }

    .cv-narrative-card h3 {
      color: #8E1626;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 1.15rem;
      margin-top: 26px;
      margin-bottom: 12px;
    }

    .cv-narrative-card h4 {
      color: #333333;
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      font-size: 1.02rem;
      margin-top: 20px;
      margin-bottom: 8px;
    }

    .cv-narrative-card p {
      margin-bottom: 18px;
      color: #2D3748;
      font-size: 0.98rem;
      text-align: justify;
      text-justify: inter-word;
      hyphens: auto;
      -webkit-hyphens: auto;
    }

    .cv-narrative-card ul,
    .cv-narrative-card ol {
      padding-left: 26px;
      margin-bottom: 18px;
      color: #2D3748;
    }

    .cv-narrative-card li {
      margin-bottom: 9px;
      font-size: 0.97rem;
      line-height: 1.7;
    }

    .cv-narrative-card strong {
      color: var(--bordeaux-main);
      font-weight: 600;
    }

    .cv-narrative-card hr {
      border: none;
      border-top: 1px solid #EAECEF;
      margin: 32px 0;
    }

    .cv-narrative-card blockquote {
      border-left: 4px solid var(--bordeaux-main);
      margin: 20px 0;
      padding: 14px 20px;
      background: rgba(107, 15, 26, 0.04);
      border-radius: 0 10px 10px 0;
      color: #4A5568;
      font-style: italic;
    }

    /* ============================================================
       RESPONSIVE DESIGN & MEDIA QUERIES
       ============================================================ */
    /* Tablet & Small Desktop (<= 1024px) */
    @media (max-width: 1024px) {
      .cv-page {
        max-width: 95%;
        padding: 28px 18px 60px;
      }
      .cv-narrative-card {
        padding: 34px 32px;
      }
      .cv-cluster-card {
        padding: 22px 24px;
      }
    }

    /* Tablet Portrait & Mobile Landscape (<= 768px) */
    @media (max-width: 768px) {
      .cv-page {
        padding: 20px 14px 50px;
      }
      .cv-profile-card {
        padding: 26px 22px;
        border-radius: 14px;
        margin-bottom: 22px;
      }
      .cv-profile-card h1 {
        font-size: 1.75rem;
      }
      .cv-cluster-section {
        margin-bottom: 26px;
      }
      .cv-cluster-stack {
        gap: 16px;
      }
      .cv-cluster-card {
        padding: 20px 18px;
      }
      .cv-cluster-card p.cv-cluster-desc {
        text-align: left;
        font-size: 0.91rem;
        line-height: 1.65;
      }
      .cv-narrative-card {
        padding: 26px 20px;
        border-radius: 14px;
      }
      .cv-narrative-card-header {
        font-size: 1.15rem;
        margin-bottom: 20px;
      }
      .cv-narrative-card p {
        text-align: left;
        font-size: 0.95rem;
        line-height: 1.75;
      }
      .cv-narrative-card h1 { font-size: 1.45rem; }
      .cv-narrative-card h2 { font-size: 1.22rem; }
      .cv-narrative-card h3 { font-size: 1.08rem; }
    }

    /* Mobile Portrait (<= 480px) */
    @media (max-width: 480px) {
      .cv-page {
        padding: 14px 10px 40px;
      }
      .cv-profile-card {
        padding: 20px 16px;
        border-radius: 12px;
      }
      .cv-profile-card h1 {
        font-size: 1.45rem;
        letter-spacing: -0.3px;
      }
      .cv-profile-card .cv-subtitle {
        font-size: 0.88rem;
      }
      .cv-logo-line {
        font-size: 0.75rem;
        margin-bottom: 10px;
      }
      .cv-logo-icon {
        width: 22px;
        height: 22px;
        font-size: 0.75rem;
      }
      .cv-cluster-section-title {
        font-size: 1.05rem;
      }
      .cv-cluster-card {
        padding: 16px 14px;
      }
      .cv-cluster-card-header {
        flex-direction: row;
        align-items: flex-start;
        gap: 8px;
      }
      .cv-cluster-num {
        font-size: 0.72rem;
        padding: 2px 7px;
      }
      .cv-cluster-card h3 {
        font-size: 1.02rem;
      }
      .cv-cluster-card p.cv-cluster-desc {
        font-size: 0.88rem;
      }
      .cv-keyword-badge {
        font-size: 0.72rem;
        padding: 2px 8px;
      }
      .cv-narrative-card {
        padding: 20px 14px;
        border-radius: 12px;
      }
      .cv-narrative-card-header {
        font-size: 1.05rem;
        padding-bottom: 10px;
      }
      .cv-narrative-card h1 { font-size: 1.3rem; margin-top: 24px; }
      .cv-narrative-card h2 { font-size: 1.12rem; margin-top: 22px; }
      .cv-narrative-card h3 { font-size: 1.02rem; margin-top: 18px; }
      .cv-narrative-card p { font-size: 0.92rem; line-height: 1.68; margin-bottom: 14px; }
      .cv-narrative-card ul, .cv-narrative-card ol { padding-left: 20px; }
      .cv-narrative-card li { font-size: 0.91rem; }
      .cv-narrative-card blockquote { padding: 10px 14px; }
    }
  </style>
</head>

<body>
  <div class="cv-page fade-in">

    <!-- Profile Header Card -->
    <div class="cv-profile-card" id="profile-card">
      <div class="cv-logo-line">
        <div class="cv-logo-icon">⚛</div>
        <span>Sciento AI</span>
      </div>
      <h1 id="author-name">—</h1>
      <div class="cv-subtitle">Academic Narrative CV</div>
      <!-- Bibliometric Overview (auto-populated by JS) -->
      <div id="bib-overview-container" style="display:none;"></div>
    </div>

    <!-- Thematic Research Areas -->
    <div class="cv-cluster-section" id="themes-section">
      <div class="cv-cluster-section-title">Thematic Research Areas</div>
      <div class="cv-cluster-stack" id="themes-grid">
        <!-- Populated dynamically by JS -->
      </div>
    </div>

    <!-- Academic Narrative CV -->
    <div class="cv-narrative-card">
      <div class="cv-narrative-card-header">📖 Academic Narrative CV</div>
      <div id="narrative-body">
        <!-- Populated dynamically by JS -->
      </div>
    </div>

  </div>

  <script>
    // Injected markdown content
    const RAW_MD = `{{MARKDOWN_CONTENT}}`;

    function parseMD(md) {
      const result = { title: "", bibliometrics: null, themes: [], biography: "" };
      const normalized = md.replace(/\r\n/g, "\n");

      // 1. Extract Author Name
      const titleMatch = normalized.match(/^#\s+(.+)$/m);
      if (titleMatch) {
        result.title = titleMatch[1].replace(/^(Academic\s+)?Narrative\s+CV:\s*/i, "").trim();
      }

      // 2. Extract Bibliometric Overview if present
      const bibMatch = normalized.match(/##\s+Bibliometric Overview([\s\S]*?)(?=\n##|\n---|$)/i);
      if (bibMatch) {
        const bibText = bibMatch[1];
        const pubsMatch = bibText.match(/\*\*Total Publications Analyzed\*\*:\s*([^\n]+)/i);
        const timespanMatch = bibText.match(/\*\*Publication Timespan\*\*:\s*([^\n]+)/i);
        const venuesMatch = bibText.match(/\*\*Unique Journals \/ Venues\*\*:\s*([^\n]+)/i);

        const journals = [];
        const journalLines = bibText.match(/^\s*-\s*\*\*([^*]+)\*\*\s*\(([^)]+)\)/gm);
        if (journalLines) {
          journalLines.forEach(line => {
            const m = line.match(/^\s*-\s*\*\*([^*]+)\*\*\s*\(([^)]+)\)/);
            if (m) {
              journals.push({ name: m[1].trim(), count: m[2].trim() });
            }
          });
        }

        result.bibliometrics = {
          totalPubs: pubsMatch ? pubsMatch[1].trim() : "",
          timespan: timespanMatch ? timespanMatch[1].trim() : "",
          uniqueVenues: venuesMatch ? venuesMatch[1].trim() : "",
          journals: journals
        };
      }

      // 3. Extract Theme Section and Biography Section
      const themeStart = normalized.indexOf("## Thematic Research Areas");
      const hrIndex = normalized.indexOf("\n---\n");

      let themeSection = "";
      let bioSection = "";

      if (themeStart !== -1) {
        if (hrIndex !== -1 && hrIndex > themeStart) {
          themeSection = normalized.slice(themeStart, hrIndex);
          bioSection = normalized.slice(hrIndex + 5);
        } else {
          themeSection = normalized.slice(themeStart);
        }
      } else {
        themeSection = hrIndex !== -1 ? normalized.slice(0, hrIndex) : normalized;
        bioSection = hrIndex !== -1 ? normalized.slice(hrIndex + 5) : "";
      }

      // 4. Parse Themes
      const themeBlocks = themeSection.split(/^###\s+/m).slice(1);
      result.themes = themeBlocks.map(block => {
        const lines = block.split("\n");
        const name = lines[0].trim();
        const rest = lines.slice(1).join("\n");

        const kwMatch = rest.match(/\*\*Keywords\*\*:\s*([^\n]+)/i);
        const pubsMatch = rest.match(/\*\*Key Publications\*\*:\s*\n([\s\S]*?)(?=\n###|\n##|$)/i);

        let description = rest;
        if (kwMatch) {
          description = description.split(/\*\*Keywords\*\*:/i)[0];
        } else if (pubsMatch) {
          description = description.split(/\*\*Key Publications\*\*:/i)[0];
        }
        description = description.trim();

        const keywords = kwMatch
          ? kwMatch[1].split(",").map(k => k.trim()).filter(Boolean)
          : [];

        const pubs = pubsMatch
          ? pubsMatch[1].split("\n").map(l => l.replace(/^-\s*/, "").trim()).filter(Boolean)
          : [];

        return { name, description, keywords, pubs };
      });

      // 5. Biography section: remove the leading ## Academic Biography heading if present
      let bioBody = bioSection.replace(/^##\s+Academic Biography\s*\n/m, "").trim();
      result.biography = bioBody;

      return result;
    }

    function toggleVenues() {
      const list = document.getElementById("venues-list");
      const btn = document.getElementById("toggle-venues-btn");
      if (!list || !btn) return;
      if (list.style.display === "none" || !list.style.display) {
        list.style.display = "flex";
        btn.classList.add("open");
      } else {
        list.style.display = "none";
        btn.classList.remove("open");
      }
    }

    function render(md) {
      const data = parseMD(md);

      // Set Author Name & Page Title
      const name = data.title || "Academic Profile";
      document.getElementById("author-name").textContent = name;
      document.title = "ScientoAI — " + name;

      // Render Bibliometrics in Profile Card
      const bibContainer = document.getElementById("bib-overview-container");
      if (data.bibliometrics && (data.bibliometrics.totalPubs || data.bibliometrics.journals.length > 0)) {
        const b = data.bibliometrics;
        bibContainer.style.display = "block";
        bibContainer.className = "cv-bib-section";
        bibContainer.innerHTML = `
          <div class="cv-bib-stats">
            ${b.totalPubs ? `<div class="cv-bib-stat-pill"><span>📄</span> Total Publications: <strong>${escHtml(b.totalPubs)}</strong></div>` : ""}
            ${b.timespan ? `<div class="cv-bib-stat-pill"><span>📅</span> Timespan: <strong>${escHtml(b.timespan)}</strong></div>` : ""}
            ${b.uniqueVenues ? `<div class="cv-bib-stat-pill"><span>🏛</span> Unique Venues: <strong>${escHtml(b.uniqueVenues)}</strong></div>` : ""}
          </div>
          ${b.journals.length > 0 ? `
            <div class="cv-bib-venues-wrap">
              <button type="button" class="cv-bib-toggle" id="toggle-venues-btn" onclick="toggleVenues()">
                <span>View Journals & Venues (${b.journals.length})</span>
                <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
              </button>
              <div class="cv-bib-venues-list" id="venues-list" style="display:none;">
                ${b.journals.map(j => `<span class="cv-venue-chip"><span>${escHtml(j.name)}</span> <span class="chip-count">${escHtml(j.count)}</span></span>`).join("")}
              </div>
            </div>
          ` : ""}
        `;
      } else {
        bibContainer.style.display = "none";
      }

      // Render Themes Stack (Full-width vertical layout)
      const grid = document.getElementById("themes-grid");
      const section = document.getElementById("themes-section");

      if (data.themes.length === 0) {
        section.style.display = "none";
      } else {
        grid.innerHTML = data.themes.map((t, idx) => `
          <div class="cv-cluster-card">
            <div class="cv-cluster-card-header">
              <span class="cv-cluster-num">Theme ${idx + 1}</span>
              <h3>${escHtml(t.name)}</h3>
            </div>
            <p class="cv-cluster-desc">${escHtml(t.description)}</p>
            ${t.keywords.length > 0 ? `
              <div class="cv-keyword-section">
                <span class="cv-meta-label">Keywords:</span>
                <div class="cv-keyword-container">
                  ${t.keywords.map(k => `<span class="cv-keyword-badge">${escHtml(k)}</span>`).join("")}
                </div>
              </div>
            ` : ""}
            ${t.pubs.length > 0 ? `
              <div class="cv-pubs-container">
                <div class="cv-pubs-header">Key Publications (${t.pubs.length}):</div>
                <ul class="cv-pubs-list">
                  ${t.pubs.map(p => `<li>${escHtml(p)}</li>`).join("")}
                </ul>
              </div>
            ` : ""}
          </div>
        `).join("");
      }

      // Render Narrative Biography via marked
      if (typeof marked !== "undefined" && typeof marked.parse === "function") {
        document.getElementById("narrative-body").innerHTML = marked.parse(data.biography || "");
      } else {
        document.getElementById("narrative-body").textContent = data.biography || "";
      }
    }

    function escHtml(str) {
      if (!str) return "";
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Execute render
    render(RAW_MD);
  </script>
</body>
</html>
