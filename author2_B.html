## Academic Biography

# Academic Narrative CV: Professor Eugenio Oropallo

## Navigating Socio-Technical Systems: Knowledge Management, Digital Transition, and System Dynamics

Professor Eugenio Oropallo has established a comprehensive research program centered on the systemic evaluation of technology adoption, knowledge management, and operational risk across complex industrial, organizational, and digital environments. His work sits at the intersection of process engineering, information systems, supply chain orchestration, and organizational theory. By combining empirical quantitative models, design science research, and bibliometric syntheses, Oropallo investigates how emerging digital architectures—such as Industry 4.0 technologies, distributed ledger systems, and virtual platforms—reconfigure decision-making mechanisms, operational resilience, and value creation in diverse sectors ranging from manufacturing and logistics to healthcare and small business operations.

A unifying thread in Oropallo's scientific trajectory is the rigorous examination of how organizations capture, transfer, and safeguard knowledge during rapid technological transformations. Rather than treating technology adoption as a purely technical implementation, his research models the dynamic feedback loops, cognitive barriers, and governance structures that determine operational stability and strategic success. This systemic orientation links foundational inquiries into industrial plant safety and dynamic system stability with contemporary investigations into decentralized blockchain governance, healthcare data interoperability, and circular supply chain ecosystems.

## Systemic Risk and Decision Support: From Process Safety to Non-Intrusive Inspection

The foundation of Oropallo’s analytical framework is rooted in quantifying resilience erosion and dynamic risk within industrial process facilities. In 'The application of System Dynamics to industrial plants in the perspective of Process Resilience Engineering' (2014), the research demonstrates how classical risk assessment tools often fall short when dealing with unexpected initiating events and loss of dynamic system stability. By operationalizing System Dynamics and Causal Loop Diagrams within a Liquefied Petroleum Gas storage plant, this work establishes a method to quantify safety level erosion under fluctuating operational conditions, framing resilience as the systemic capacity to sustain operational safety under both anticipated and unanticipated disturbances.

This early commitment to quantifying operational trade-offs evolved into data-driven decision support systems designed to optimize maintenance scheduling and inspection economics. In 'A decision support system to assess the operational safety and economic benefits of risk-based inspection implementation strategies' (2024), Oropallo and his co-authors extend American Petroleum Institute API RP 581 standards by constructing a decision support platform that evaluates non-intrusive inspection methodologies. Applied to shell and tube heat exchangers facing corrosion-based damage mechanisms such as thinning and corrosion under insulation, the platform balances financial risk against operational safety, demonstrating how non-destructive testing reduces costly scheduled plant shutdowns without compromising integrity.

## Knowledge Management Architectures and Meta-Analytic Synthesis

Recognizing that operational resilience relies fundamentally on structural knowledge capabilities, Oropallo conducted extensive epistemological and bibliometric studies to map the trajectory of knowledge management research. In 'Knowing what you don’t know: a tertiary study on knowledge management' (2023), he synthesizes two decades of literature reviews through an integrated tertiary methodology, deploying bibliometric clustering alongside systematic analysis to identify sustained research streams alongside persistent theoretical blindspots. This structural diagnosis laid the groundwork for re-evaluating core organizational knowledge creation frameworks in light of modern digital transitions.

To accommodate the rapid digital transformation of enterprise ecosystems, Oropallo reinterprets classic knowledge creation models. In 'The WISED knowledge-creating company: rethinking SECI model in light of the digital transition' (2024), the research reconfigures Nonaka’s SECI framework into the WISED model, formalizing five digital knowledge processes: webification, informalisation, systematisation, explicitation, and digitalisation. This framework is extended into specialized sectors in 'Investigating Healthcare 4.0 Transition Through a Knowledge Management Perspective' (2023), where 4.0 enabling technologies are shown to restructure socialization, externalization, combination, and internalization in clinical settings. Furthermore, Oropallo explored virtual environments in 'A first bibliometric literature review on Metaverse' (2022) and 'Kick-start your scientific journey into the metaverse' (2023), utilizing keyword co-occurrence analysis and network topologies to map three-dimensional avatar architectures and virtual world platforms. Completing this stream, 'Digital knowledge management in agile self-tuning organisations: a multiple case study' (2025) employs a grounded theory multi-case approach to analyze how data-intensive, knowledge-intensive businesses deploy Industry 4.0 tools to build self-tuning, agile knowledge mechanisms.

## Organizational Transformation in SMEs: Dynamic Capabilities, Internationalization, and Customer Knowledge

Translating high-level knowledge creation frameworks into organizational practice, Oropallo focused on small and medium enterprises (SMEs) struggling with resource constraints, dynamic market expansion, and digital inertia. In 'Assessing SMEs' internationalisation strategies in action' (2020), a structured content analysis across major scientific databases maps the enablers, barriers, and phase transitions that SMEs encounter during cross-border growth, highlighting critical research gaps between early entrance and sustained international expansion.

Simultaneously, Oropallo examined how creative and traditional SMEs navigate digital adoption at the interface of customer management. In 'Customer knowledge management in SMEs facing digital transformation' (2020), an empirical survey of luxury handicraft and retail enterprises defines customer knowledge management as the structural intersection of customer relationship management and knowledge management. The study reveals a significant gap: despite the availability of cost-effective digital tools, SMEs exhibit tech inertia and rely heavily on traditional systems, pointing to decision-support deficits among IT vendors and underscoring the need for tailored dynamic capability development.

## Distributed Ledger Design and Decentralized Governance Protocols

As centralized data management systems increasingly faced security, interoperability, and trust deficits, Oropallo shifted a major portion of his research toward decentralized architectures and blockchain technology. In 'Surfing blockchain wave, or drowning? Shaping the future of distributed ledgers and decentralized technologies' (2021), a comprehensive bibliometric performance and network analysis maps the research topology of distributed ledgers, identifying core research clusters and outlining how the key features of traceability, tracking, transparency, and trust can re-engineer transaction processes across organizational boundaries.

Building upon this foundational mapping, Oropallo applied Design Science Research (DSR) to build concrete distributed ledger solutions for administrative and medical governance. In 'Blockchain technology design in accounting: Game changer to tackle fraud or technological fairy tale?' (2022), he constructs a three-layer scalable accounting framework—integrating a peer-to-peer distributed database, validation permission layers, and business security applications—to eliminate accounting fraud. Expanding DSR into medical data management, 'Blockchain design in health data management' (2022) engineers a permissioned platform that resolves electronic health record fragmentation, permitting secure therapy tracking while eliminating transparency and privacy risks across the healthcare value chain.

In parallel, Oropallo extended decentralized ledger models to sustainable industrial loops. In 'Blockchain technology for bridging trust, traceability and transparency in circular supply chain' (2022), he formulates the integrated Triple Retry framework, which connects reverse logistics processes (recycling, redistribution, remanufacturing) with blockchain capabilities to achieve end-to-end material traceability and waste control across multi-actor supply chains. In 'Blockchain's coming to hospital to digitalize healthcare services: Designing a distributed electronic health record ecosystem' (2023), Oropallo applies Information Processing Theory to validate a private permissioned EHR ecosystem, demonstrating how distributed record sharing mitigates environmental uncertainty and improves multi-level organizational performance.

## Supply Chain Orchestration, Resilience, and Sustainable Life Cycle Analysis

The synthesis of technological capabilities, dynamic resilience, and environmental sustainability forms the empirical boundary of Oropallo's recent work. In 'Sailing through a digital and resilient shipbuilding supply chain: An empirical investigation' (2023), a multi-case study grounded in the Resource-Based View and dynamic capabilities investigates Industry 4.0 adoption in engineering-to-order shipbuilding supply chains, demonstrating how digital integration directly enhances supply chain resilience and market positioning. On a broader network scale, 'Towards a sustainable development assessment framework to bridge supply chain practices and technologies' (2022) establishes a systemic taxonomy connecting sustainable supply chain practices with supporting IT capabilities, emphasizing dyadic orchestration across complex supply networks.

This framework extends into high-tech medical and cybersecurity operations. In 'Blockchain Technology for Embracing Healthcare 4.0' (2023), real-time big data synchronization models and cryptographic protection protocols are integrated into a Healthcare 4.0 architecture to dismantle operational data silos and optimize clinical diagnostic accuracy. Addressing the operational trade-offs of cybersecurity, 'Is cybersecurity outsourcing always effective? Strategic organisational insights and knowledge in the era of digitalisation' (2026) employs Mann-Whitney U tests and binary logistic regression to compare NIST-aligned internal management against external outsourcing. The study establishes that while outsourcing delivers external managerial innovation, internal management retains vital tacit knowledge and fosters experiential learning loops essential for incident recovery.

Finally, Oropallo's sustainability research addresses physical life cycles and psychological antecedents of sustainable behavior. In 'What we learn is what we earn from sustainable and circular construction' (2023), bibliometric and network mapping link Building Information Modeling with Life Cycle Assessment to quantify embodied emissions and material recycling pathways in sustainable construction. Complementing this macro-level industrial view, Oropallo investigates micro-level consumer decisions using psychometric modeling. In 'Smoking kills you, littering butts damages others too: analysing sustainable consumer behaviour in the era of circular economy' (2022), structural equation modeling tests the impact of feared-self concepts and landfill awareness on littering behavior. This psychometric approach is further refined in 'Sustainability and socially responsible food consumption: an empirical investigation based on self-awareness and self-congruity theories' (2024), where factor analyses confirm that altruistic-self and hunger awareness congruence, mediated by food-saving attitudes, drives socially responsible consumption under Sustainable Development Goal 2.

## Theoretical Convergence: Integrative Frameworks for Next-Generation Digital Ecosystems

Professor Eugenio Oropallo’s scholarship demonstrates a continuous progression from quantifying safety and resilience in physical plant operations to engineering decentralized, data-driven governance frameworks for complex socio-technical ecosystems. By systematically linking formal quantitative techniques—such as non-parametric statistics, structural equation modeling, and system dynamics—with qualitative design science and grounded theory, his work provides robust managerial and architectural tools for navigating modern digital transitions.

Looking forward, Oropallo’s research trajectory points toward an integrated paradigm where organizational knowledge creation, decentralized privacy-preserving ledgers, and dynamic supply chain resilience converge. His ongoing contributions continue to clarify how emerging Industry 4.0 and Web 3.0 architectures can be ethically, operationally, and sustainably deployed to solve systemic challenges across healthcare, manufacturing, circular supply chains, and small enterprise networks.

    function parseMD(md) {
      const result = { title: "", bibliometrics: null, themes: [], biography: "" };
      const normalized = md.replace(/\r\n/g, "\n");

      // 1. Extract Author Name
      const titleMatch = normalized.match(/^#\s+(.+)$/m);
      if (titleMatch) {
        result.title = titleMatch[1].replace(/^(Academic\s+)?Narrative\s+CV:\s*/i, "").trim();
      }

      // 2. Extract Bibliometric Overview if present
      const bibMatch = normalized.match(/##\s+Bibliometric Overview([\s\S]*?)(?=\n##|\n---|$)/i);
      if (bibMatch) {
        const bibText = bibMatch[1];
        const pubsMatch = bibText.match(/\*\*Total Publications Analyzed\*\*:\s*([^\n]+)/i);
        const timespanMatch = bibText.match(/\*\*Publication Timespan\*\*:\s*([^\n]+)/i);
        const venuesMatch = bibText.match(/\*\*Unique Journals \/ Venues\*\*:\s*([^\n]+)/i);

        const journals = [];
        const journalLines = bibText.match(/^\s*-\s*\*\*([^*]+)\*\*\s*\(([^)]+)\)/gm);
        if (journalLines) {
          journalLines.forEach(line => {
            const m = line.match(/^\s*-\s*\*\*([^*]+)\*\*\s*\(([^)]+)\)/);
            if (m) {
              journals.push({ name: m[1].trim(), count: m[2].trim() });
            }
          });
        }

        result.bibliometrics = {
          totalPubs: pubsMatch ? pubsMatch[1].trim() : "",
          timespan: timespanMatch ? timespanMatch[1].trim() : "",
          uniqueVenues: venuesMatch ? venuesMatch[1].trim() : "",
          journals: journals
        };
      }

      // 3. Extract Theme Section and Biography Section
      const themeStart = normalized.indexOf("## Thematic Research Areas");
      const hrIndex = normalized.indexOf("\n---\n");

      let themeSection = "";
      let bioSection = "";

      if (themeStart !== -1) {
        if (hrIndex !== -1 && hrIndex > themeStart) {
          themeSection = normalized.slice(themeStart, hrIndex);
          bioSection = normalized.slice(hrIndex + 5);
        } else {
          themeSection = normalized.slice(themeStart);
        }
      } else {
        themeSection = hrIndex !== -1 ? normalized.slice(0, hrIndex) : normalized;
        bioSection = hrIndex !== -1 ? normalized.slice(hrIndex + 5) : "";
      }

      // 4. Parse Themes
      const themeBlocks = themeSection.split(/^###\s+/m).slice(1);
      result.themes = themeBlocks.map(block => {
        const lines = block.split("\n");
        const name = lines[0].trim();
        const rest = lines.slice(1).join("\n");

        const kwMatch = rest.match(/\*\*Keywords\*\*:\s*([^\n]+)/i);
        const pubsMatch = rest.match(/\*\*Key Publications\*\*:\s*\n([\s\S]*?)(?=\n###|\n##|$)/i);

        let description = rest;
        if (kwMatch) {
          description = description.split(/\*\*Keywords\*\*:/i)[0];
        } else if (pubsMatch) {
          description = description.split(/\*\*Key Publications\*\*:/i)[0];
        }
        description = description.trim();

        let keywords = [];
        if (kwMatch) {
          // Split on commas that are outside parentheses
          const raw = kwMatch[1].trim();
          const tokens = [];
          let current = "";
          let depth = 0;
          for (let i = 0; i < raw.length; i++) {
            const char = raw[i];
            if (char === "(") depth++;
            else if (char === ")") depth = Math.max(0, depth - 1);

            if (char === "," && depth === 0) {
              if (current.trim()) tokens.push(current.trim());
              current = "";
            } else {
              current += char;
            }
          }
          if (current.trim()) tokens.push(current.trim());
          keywords = tokens;
        }

        const pubs = pubsMatch
          ? pubsMatch[1].split("\n").map(l => l.replace(/^-\s*/, "").trim()).filter(Boolean)
          : [];

        return { name, description, keywords, pubs };
      });

      // 5. Biography section: remove the leading ## Academic Biography heading if present
      let bioBody = bioSection.replace(/^##\s+Academic Biography\s*\n/m, "").trim();
      result.biography = bioBody;

      return result;
    }

    function toggleVenues() {
      const list = document.getElementById("venues-list");
      const btn = document.getElementById("toggle-venues-btn");
      if (!list || !btn) return;
      if (list.style.display === "none" || !list.style.display) {
        list.style.display = "flex";
        btn.classList.add("open");
      } else {
        list.style.display = "none";
        btn.classList.remove("open");
      }
    }

    function render(md) {
      const data = parseMD(md);

      // Set Author Name & Page Title
      const name = data.title || "Academic Profile";
      document.getElementById("author-name").textContent = name;
      document.title = "ScientoAI — " + name;

      // Render Bibliometrics in Profile Card
      const bibContainer = document.getElementById("bib-overview-container");
      if (data.bibliometrics && (data.bibliometrics.totalPubs || data.bibliometrics.journals.length > 0)) {
        const b = data.bibliometrics;
        bibContainer.style.display = "block";
        bibContainer.className = "cv-bib-section";
        bibContainer.innerHTML = `
          <div class="cv-bib-stats">
            ${b.totalPubs ? `<div class="cv-bib-stat-pill"><span>📄</span> Total Publications: <strong>${escHtml(b.totalPubs)}</strong></div>` : ""}
            ${b.timespan ? `<div class="cv-bib-stat-pill"><span>📅</span> Timespan: <strong>${escHtml(b.timespan)}</strong></div>` : ""}
            ${b.uniqueVenues ? `<div class="cv-bib-stat-pill"><span>🏛</span> Unique Venues: <strong>${escHtml(b.uniqueVenues)}</strong></div>` : ""}
          </div>
          ${b.journals.length > 0 ? `
            <div class="cv-bib-venues-wrap">
              <button type="button" class="cv-bib-toggle" id="toggle-venues-btn" onclick="toggleVenues()">
                <span>View Journals & Venues (${b.journals.length})</span>
                <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
              </button>
              <div class="cv-bib-venues-list" id="venues-list" style="display:none;">
                ${b.journals.map(j => `<span class="cv-venue-chip"><span>${escHtml(j.name)}</span> <span class="chip-count">${escHtml(j.count)}</span></span>`).join("")}
              </div>
            </div>
          ` : ""}
        `;
      } else {
        bibContainer.style.display = "none";
      }

      // Render Themes Stack (Full-width vertical layout)
      const grid = document.getElementById("themes-grid");
      const section = document.getElementById("themes-section");

      if (data.themes.length === 0) {
        section.style.display = "none";
      } else {
        grid.innerHTML = data.themes.map((t, idx) => `
          <div class="cv-cluster-card">
            <div class="cv-cluster-card-header">
              <span class="cv-cluster-num">Theme ${idx + 1}</span>
              <h3>${escHtml(t.name)}</h3>
            </div>
            <p class="cv-cluster-desc">${escHtml(t.description)}</p>
            ${t.keywords.length > 0 ? `
              <div class="cv-keyword-section">
                <span class="cv-meta-label">Keywords:</span>
                <div class="cv-keyword-container">
                  ${t.keywords.map(k => `<span class="cv-keyword-badge">${escHtml(k)}</span>`).join("")}
                </div>
              </div>
            ` : ""}
            ${t.pubs.length > 0 ? `
              <div class="cv-pubs-container">
                <div class="cv-pubs-header">Key Publications (${t.pubs.length}):</div>
                <ul class="cv-pubs-list">
                  ${t.pubs.map(p => `<li>${escHtml(p)}</li>`).join("")}
                </ul>
              </div>
            ` : ""}
          </div>
        `).join("");
      }

      // Render Narrative Biography via marked
      if (typeof marked !== "undefined" && typeof marked.parse === "function") {
        document.getElementById("narrative-body").innerHTML = marked.parse(data.biography || "");
      } else {
        document.getElementById("narrative-body").textContent = data.biography || "";
      }
    }

    function escHtml(str) {
      if (!str) return "";
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Execute render
    render(RAW_MD);
  </script>
