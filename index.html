<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScientoAI — Expert Evaluation Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bordeaux-main:  #6B0F1A;
      --bordeaux-dark:  #4A0A12;
      --bg-app:         #F8F9FA;
      --text-main:      #1D1D1F;
      --text-muted:     #6E6E73;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-main);
      background-color: var(--bg-app);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .portal-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 580px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
      border: 1px solid #EAECEF;
      text-align: center;
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(107, 15, 26, 0.08);
      color: var(--bordeaux-main);
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.7rem;
      font-weight: 800;
      color: var(--bordeaux-main);
      margin-bottom: 14px;
    }
    p {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .info-box {
      background: #FDF4F5;
      border-left: 4px solid var(--bordeaux-main);
      padding: 14px 18px;
      border-radius: 6px;
      text-align: left;
      font-size: 0.88rem;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="portal-card">
    <div class="logo-badge">⚛ Sciento AI</div>
    <h1>Expert Evaluation Portal</h1>
    <p>This portal hosts individual academic narrative CV evaluation materials.</p>
    <div class="info-box">
      <strong>Direct Link Access Only:</strong> Please use the direct links provided in your official evaluation survey to access assigned candidate documents.
    </div>
  </div>
</body>
</html>
