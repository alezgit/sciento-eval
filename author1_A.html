Develops statistical and computational techniques for identifying and correcting hidden errors in time-series and longitudinal datasets, with a focus on distinguishing elusive errors from natural fluctuations and trends. The approach operates at a formal level, analyzing symmetries and asymmetries in consecutive value differences, and is domain-agnostic, enabling applications in diverse contexts such as higher education datasets. This theme underpins reliable benchmarking and policy analysis by ensuring data quality in longitudinal studies.

# Academic Narrative CV: Professor Simone Di Leo

## Overview
Professor Simone Di Leo’s research program is a cohesive, interdisciplinary endeavor that integrates **quantitative efficiency analysis, sustainability assessment, and data-driven decision-making** across economic, environmental, and institutional domains. His work is unified by a commitment to **methodological rigor**—leveraging nonparametric frontier methods (e.g., Data Envelopment Analysis, directional distances, conditional efficiency), composite indicators, and systematic review frameworks—to address complex socio-technical challenges. The narrative below organizes his contributions into ten thematic clusters, each grounded in specific methodological stances and empirical applications, while highlighting their interdependencies and evolution.

---

## **1. Longitudinal Error Detection Methods**
Professor Di Leo advances **statistical-mathematical techniques for error detection in longitudinal datasets**, with a focus on distinguishing *elusive errors* from natural fluctuations and trends in time-series data. His approach operates at a **formal level**, analyzing symmetries and asymmetries in consecutive value differences to capture hidden errors that survive generic correction techniques (e.g., standard error treatments). This method is **domain-agnostic**, enabling applications in diverse contexts such as higher education datasets (e.g., ETER database variables like *Total academic staff* and *Total enrolled students*).

- **Intellectual Commitment**: Development of **indicator-based systems** to study data evolution without imposing domain-specific assumptions, ensuring flexibility and generality.
- **Enables**: Robust longitudinal data quality, which underpins reliable benchmarking and policy analysis in themes like *University Research Outlier Detection* and *Composite Indicators for Sustainability*.
- **Contrasts With**: Generic error correction techniques, which often fail to address elusive errors in large-scale datasets.

**Representative Publications**:
- *Flexible Techniques to Detect Typical Hidden Errors in Large Longitudinal Datasets (2024)*

## **2. Sustainability and Economic Viability Assessment**
This theme represents the **core of Di Leo’s applied research**, where he evaluates the **economic, environmental, and social sustainability** of systems such as waste management, PV+BES (photovoltaic + battery energy storage) integration, and circular economy models. His methodology combines:
- **Multi-criteria decision analysis (MCDA)** for strategic prioritization.
- **Financial modeling** (e.g., Net Present Value, Discounted Cash Flow, Monte Carlo simulations) to assess profitability under uncertainty.
- **Sensitivity and scenario analysis** to identify critical levers (e.g., self-consumption rates, electricity purchase prices, policy incentives).
- **Policy-oriented frameworks** to align technological adoption with Sustainable Development Goals (e.g., SDG 7 on affordable and clean energy).

- **Intellectual Commitment**: A **quantitative, interdisciplinary approach** that integrates technical, economic, and behavioral dimensions. For example, his work on PV+BES systems demonstrates that **profitability hinges on self-consumption optimization** (e.g., 22–35% thresholds for BES viability) and policy support (e.g., 40–50% tax deductions). In waste management, he applies **DEA-based efficiency analysis** to evaluate the impact of regulatory targets (e.g., Italy’s 65% sorted waste mandate) on municipal performance.
- **Underpins**: Themes like *Composite Indicators for Sustainability* (by providing empirical inputs) and *Circular Consumer Behavior Analytics* (by linking economic incentives to behavioral change).
- **Evolves With**: The *Conditional Eco-Efficiency Benchmarking* theme, where external factors (e.g., population, economic development) are explicitly modeled to set realistic targets.

## **3. Composite Indicators for Sustainability**
Di Leo develops and critiques **composite indicators** to assess sustainability across domains (e.g., European SDG performance, energy retail markets). His work emphasizes:
- **Methodological consistency**: Comparing normalization techniques (e.g., min–max) and aggregation methods (e.g., TOPSIS, equal weighting).
- **Metaknowledge extraction**: Using systematic reviews to synthesize state-of-the-art indicators and frameworks.
- **Policy relevance**: Designing indicators to inform balanced sustainability assessments (e.g., technical, economic, environmental impacts in energy retail markets).

- **Intellectual Commitment**: A **critical, comparative approach** to indicator selection and weighting, addressing the subjectivity of evaluation processes (e.g., the “implementation problem” in performance measurement).
- **Enables**: The *Sustainability and Economic Viability Assessment* theme by providing standardized metrics for cross-domain comparisons.
- **Contrasts With**: Ad-hoc indicator sets, which often lack transparency or reproducibility.

**Representative Publications**:
- *Evaluating sustainability in Europe with composite indicators (2025)*
- *A Framework for the Analysis of the Sustainability of the Energy Retail Market (2022)*
- *Systematic reviews as a metaknowledge tool: caveats and a review of available options (2023)*

## **4. University Non-Academic Staff Performance**
This theme investigates the **role of administrative and technical staff heterogeneity** in university performance under the **New Public Management (NPM) paradigm**. Di Leo’s work:
- **Models unobserved heterogeneity** in non-academic staff using nonparametric approaches.
- **Evaluates its impact** on efficiency, revealing that qualitative and structural differences (not just staff size) drive performance.
- **Identifies trade-offs**: High heterogeneity combined with large administrative shares may lead to bureaucratic overload, while effective integration of diverse competencies can enhance teaching and research efficiency.

- **Intellectual Commitment**: A **latent factor analysis** to capture qualitative aspects of non-academic staff contributions, moving beyond simplistic headcount metrics.
- **Underpins**: The *University Research Outlier Detection* theme by contextualizing how staff composition affects research output and institutional efficiency.
- **Contrasts With**: Traditional input-output models that ignore the nuanced role of non-academic staff.

**Representative Publications**:
- *The role of the non-academic staff heterogeneity in the performance of European universities (2026)*

---

## **5. Conditional Eco-Efficiency Benchmarking**
Di Leo applies **conditional efficiency analysis** to waste management, focusing on **collaborative waste collection communities (ATOs)**. His methodology:
- **Sets viable eco-efficiency targets** that account for external factors (e.g., size, economic development) and optimal resource allocation.
- **Benchmarks municipalities** against peers with similar contexts, ensuring fairness and practicality.

- **Intellectual Commitment**: A **context-aware benchmarking approach** that recognizes the limitations of one-size-fits-all efficiency targets.
- **Enables**: The *Sustainability and Economic Viability Assessment* theme by providing actionable, community-specific goals for circular economy transitions.
- **Builds On**: The *Longitudinal Error Detection Methods* theme, as high-quality data is essential for accurate conditional analysis.

**Representative Publications**:
- *Viable eco-efficiency targets for waste collection communities (2024)*

## **6. University Research Outlier Detection**
This theme focuses on **identifying outliers in university research output** using:
- **Leiden Rankings** as a heuristic base for detecting institutions that perform significantly above or below expectations.
- **Statistical analysis and network mapping** to profile universities via economic, administrative, and research data (e.g., Scopus publications, institutional balance sheets).
- **Case study methodology** to verify heuristic findings (e.g., the role of “small teams” led by young scholars in pushing performance).

- **Intellectual Commitment**: A **heuristic + empirical validation** approach to uncover patterns in the European academic landscape, addressing biases in ranking methodologies.
- **Underpins**: The *University Non-Academic Staff Performance* theme by linking staff heterogeneity to research output anomalies.
- **Contrasts With**: Static ranking systems that fail to account for dynamic or contextual factors.

**Representative Publications**:
- *An integrated dataset providing a landscape of the Italian Universities (2023)*
- *A heuristic approach based on Leiden rankings to identify outliers: evidence from Italian universities in the European landscape (2023)*

## **7. Circular Consumer Behavior Analytics**
Di Leo examines **generational and gender differences in sustainable consumer behavior**, particularly for **e-waste management**. His methodology includes:
- **Survey-based data collection** (e.g., 407 respondents) to capture attitudes, purchasing decisions, and end-of-life management practices.
- **Statistical tests, Principal Component Analysis (PCA), and K-means clustering** to segment consumers and identify behavioral patterns.
- **Policy-relevant insights**: For example, economic incentives emerge as the most effective measure for guiding sustainable behavior (30.71% of respondents), while knowledge gaps persist (e.g., only 29.48% know where to dispose of e-waste).

- **Intellectual Commitment**: A **behavioral segmentation approach** that links awareness to action, informing targeted circular economy strategies.
- **Enables**: The *Sustainability and Economic Viability Assessment* theme by providing demand-side insights for policy design (e.g., differentiated strategies for young vs. older consumers).
- **Contrasts With**: One-size-fits-all policy interventions that ignore heterogeneity in consumer motivations.

**Representative Publications**:
- *From Awareness to Action: Consumer Behaviour, Attitudes and Business Strategy in Sustainable and Circular Electronic Devices (2026)*

---

## **8. Completeness-Aware Data Integration**
This theme addresses **data quality in multi-source integration systems**, with a focus on:
- **Completeness across time and space dimensions** to support multi-purpose data infrastructures.
- **A “by-design” integration layer** that maximizes information availability for end-users without requiring preliminary quality checks on individual databases.

- **Intellectual Commitment**: A **proactive data quality framework** that extends the functionality of individual sources, transforming data infrastructures into knowledge infrastructures.
- **Underpins**: The *Longitudinal Error Detection Methods* and *University Research Outlier Detection* themes by ensuring high-quality, integrated datasets for analysis.
- **Contrasts With**: Reactive data cleaning approaches that place the burden on end-users.

**Representative Publications**:
- *Accounting for quality in data integration systems: a completeness-aware integration approach (2022)*

---

## **9. Cross-Domain Digital Twin Evolution**
Di Leo evaluates the **adoption and barriers of digital twin (DT) technologies** in industrial and healthcare domains using:
- **Integrated Flexible Systematic Review (IFSR) frameworks** to analyze sector-specific trends, enablers, and barriers.
- **Cross-domain spillover analysis**: For example, industrial DT innovations (e.g., real-time analytics, AR/VR) influence healthcare, while healthcare’s precision demands enhance industrial DT development.
- **Identification of critical barriers**: Interoperability gaps, regulatory constraints, and computational challenges, particularly in healthcare.

- **Intellectual Commitment**: A **dynamic, cross-sectoral review model** that captures the evolution of DT technologies and their adaptive potential.
- **Enables**: The *Sustainability and Economic Viability Assessment* theme by highlighting how DTs can support sustainable transitions (e.g., predictive maintenance for renewable energy systems).
- **Contrasts With**: Siloed, domain-specific analyses that overlook spillover effects.

**Representative Publications**:
- *An Integrated and Flexible Review Framework to Evaluate the Evolution and Barriers of Digital-Twin Technologies in Industrial and Healthcare Domains (2025)*

---

## **10. Conical Efficiency Frontier Analysis**
Di Leo advances **efficiency analysis** by developing **Conical Free Disposal Hull (CFDH) estimators** for:
- **Directional distances** to the cone spanned by the attainable set, applicable to **general technologies** (without imposing convexity).
- **Luenberger productivity indices** and their decompositions for non-convex attainable sets under Constant Returns to Scale (CRS).
- **Statistical properties** of these measures, enabling inference on productivity indices.

- **Intellectual Commitment**: A **generalized, non-convex efficiency framework** that extends traditional DEA and directional distance methods.
- **Underpins**: The *Conditional Eco-Efficiency Benchmarking* and *Sustainability and Economic Viability Assessment* themes by providing robust, theoretically grounded efficiency metrics.
- **Contrasts With**: Convexity-assuming methods that limit applicability to real-world, non-convex technologies.

**Representative Publications**:
- *Conical Free Disposal Hull estimators of directional distances and Luenberger productivity indices for general technologies (2025)*

---

## **Thematic Interdependencies and Evolution**
Di Leo’s research program is **highly synergistic**, with themes reinforcing one another:
1. **Methodological Foundations**: *Longitudinal Error Detection Methods*, *Completeness-Aware Data Integration*, and *Conical Efficiency Frontier Analysis* provide the **quantitative rigor** that underpins applied themes like *Sustainability Assessment* and *Circular Consumer Behavior Analytics*.
2. **Sustainability Core**: The *Sustainability and Economic Viability Assessment* theme **synthesizes** insights from *Composite Indicators*, *Conditional Eco-Efficiency Benchmarking*, and *Circular Consumer Behavior Analytics* to inform policy and investment decisions.
3. **Institutional Focus**: *University Non-Academic Staff Performance* and *University Research Outlier Detection* **complement** each other by examining both the internal dynamics (staff heterogeneity) and external outputs (research performance) of higher education institutions.
4. **Cross-Domain Innovation**: The *Cross-Domain Digital Twin Evolution* theme **extends** the program’s scope to emerging technologies, demonstrating how methodological advancements (e.g., systematic reviews) can be adapted to new domains.

Over time, Di Leo’s work has **evolved from foundational methodological contributions** (e.g., error detection, efficiency analysis) to **integrated, policy-relevant applications** (e.g., PV+BES sustainability, circular economy strategies), while maintaining a consistent emphasis on **rigor, generality, and real-world impact**.

    function parseMD(md) {
      const result = { title: "", themes: [], biography: "" };
      const normalized = md.replace(/\r\n/g, "\n");

      // 1. Extract Author Name
      const titleMatch = normalized.match(/^#\s+(.+)$/m);
      if (titleMatch) {
        result.title = titleMatch[1].replace(/^Narrative CV:\s*/i, "").trim();
      }

      // 2. Split on the hr separator (---) dividing themes and biography
      const hrIndex = normalized.indexOf("\n---\n");
      const themeSection = hrIndex !== -1 ? normalized.slice(0, hrIndex) : normalized;
      const bioSection = hrIndex !== -1 ? normalized.slice(hrIndex + 5) : "";

      // 3. Parse Themes
      const themeBlocks = themeSection.split(/^###\s+/m).slice(1);
      result.themes = themeBlocks.map(block => {
        const lines = block.split("\n");
        const name = lines[0].trim();
        const rest = lines.slice(1).join("\n");

        const kwMatch = rest.match(/\*\*Keywords\*\*:\s*([^\n]+)/i);
        const pubsMatch = rest.match(/\*\*Key Publications\*\*:\s*\n([\s\S]*?)(?=\n###|\n##|$)/i);

        let description = rest;
        if (kwMatch) {
          description = description.split(/\*\*Keywords\*\*:/i)[0];
        } else if (pubsMatch) {
          description = description.split(/\*\*Key Publications\*\*:/i)[0];
        }
        description = description.trim();

        const keywords = kwMatch
          ? kwMatch[1].split(",").map(k => k.trim()).filter(Boolean)
          : [];

        const pubs = pubsMatch
          ? pubsMatch[1].split("\n").map(l => l.replace(/^-\s*/, "").trim()).filter(Boolean)
          : [];

        return { name, description, keywords, pubs };
      });

      // 4. Biography section: remove the leading ## Academic Biography heading if present
      let bioBody = bioSection.replace(/^##\s+Academic Biography\s*\n/m, "").trim();
      result.biography = bioBody;

      return result;
    }

    function render(md) {
      const data = parseMD(md);

      // Set Author Name & Page Title
      const name = data.title || "Academic Profile";
      document.getElementById("author-name").textContent = name;
      document.title = "ScientoAI — " + name;

      // Render Themes Stack (Full-width vertical layout)
      const grid = document.getElementById("themes-grid");
      const section = document.getElementById("themes-section");

      if (data.themes.length === 0) {
        section.style.display = "none";
      } else {
        grid.innerHTML = data.themes.map((t, idx) => `
          <div class="cv-cluster-card">
            <div class="cv-cluster-card-header">
              <span class="cv-cluster-num">Theme ${idx + 1}</span>
              <h3>${escHtml(t.name)}</h3>
            </div>
            <p class="cv-cluster-desc">${escHtml(t.description)}</p>
            ${t.keywords.length > 0 ? `
              <div class="cv-keyword-section">
                <span class="cv-meta-label">Keywords:</span>
                <div class="cv-keyword-container">
                  ${t.keywords.map(k => `<span class="cv-keyword-badge">${escHtml(k)}</span>`).join("")}
                </div>
              </div>
            ` : ""}
            ${t.pubs.length > 0 ? `
              <div class="cv-pubs-container">
                <div class="cv-pubs-header">Key Publications (${t.pubs.length}):</div>
                <ul class="cv-pubs-list">
                  ${t.pubs.map(p => `<li>${escHtml(p)}</li>`).join("")}
                </ul>
              </div>
            ` : ""}
          </div>
        `).join("");
      }

      // Render Narrative Biography via marked
      if (typeof marked !== "undefined" && typeof marked.parse === "function") {
        document.getElementById("narrative-body").innerHTML = marked.parse(data.biography || "");
      } else {
        document.getElementById("narrative-body").textContent = data.biography || "";
      }
    }

    function escHtml(str) {
      if (!str) return "";
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Execute render
    render(RAW_MD);
