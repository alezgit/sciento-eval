## Academic Biography

# Academic Narrative CV: Professor Cinzia Daraio

## Epistemic Rigor and the Measurement of Complex Systems

Professor Cinzia Daraio has established a comprehensive research program at the intersection of economic statistics, operations research, scientometrics, and public policy evaluation. Her intellectual agenda addresses the fundamental methodological challenges of evaluating performance, efficiency, and data quality across multi-dimensional, complex institutional environments. By bridging formal mathematical modeling with policy-relevant empirical applications, Professor Daraio's work establishes new standards for how decision-making units—ranging from higher education institutions and public safety departments to municipal waste utilities and global corporate R&D systems—can be benchmarked under contextual heterogeneity and incomplete information.

Central to her academic contribution is the conviction that quantitative performance measurement cannot be decoupled from data quality, ethical frameworks, and decision-makers' explicit preferences. Her research systematically integrates non-parametric frontier estimation, multi-criteria decision analysis (MCDA), semantic knowledge architectures, and statistical physics to model structural efficiency while accounting for external environmental constraints. Through this multi-disciplinary lens, Professor Daraio advances both theoretical frontier estimation tools and practical, responsible policy evaluation mechanisms.

## Advanced Nonparametric Frontier Estimation and Productivity Inference

Professor Daraio's methodological contributions to efficiency analysis significantly advance non-parametric production frontier estimation. In 'Approximations and inference for envelopment estimators of production frontiers' (2024), co-authored with L. Simar, she addresses a key limitation of traditional Data Envelopment Analysis (DEA) and Free Disposal Hull (FDH) estimators—namely, their inability to yield partial derivatives and economic marginal products. By introducing nonparametrically smoothed efficient boundaries based on local linear models within a multivariate directional distance framework, this work provides statistical inference via bootstrap techniques for economic coefficients without making arbitrary parametric assumptions about the underlying technology or inefficiency distributions.

Expanding these methodological boundaries to non-convex production sets under constant returns to scale, 'Conical Free Disposal Hull estimators of directional distances and Luenberger productivity indices for general technologies' (2025), written with S. Di Leo and L. Simar, formulates directional distance measures to the cone spanned by the attainable set. This advances the statistical foundation for estimating Luenberger productivity indices and their decompositions across general technologies. To systematically consolidate empirical productivity literature, 'A Framework for the Assessment and Consolidation of Productivity Stylized Facts' (2021) formulates a doubly conditional performance evaluation model alongside an econometric consolidation approach. Furthermore, in 'How does Internationalisation affect the productivity of R&D activities in large innovative firms? A conditional nonparametric investigation' (2023), Professor Daraio and her co-authors operationalize conditional DEA estimators to reveal how firm-level R&D intensity and geographic diversification enable corporate knowledge production to overcome the friction of internationalization.

## Integrating Directional Distances with Multi-Criteria Decision Analysis

Recognizing that single-dimensional or unconstrained efficiency models often force unrealistic compensation between inputs and outputs, Professor Daraio pioneered the integration of directional distance functions with multi-criteria outranking techniques. In 'Combining Directional Distances and ELECTRE Multicriteria Decision Analysis for Preferable Assessments of Efficiency' (2023), co-authored with T. C. C. Nepomuceno, she demonstrates how non-compensatory directions can be constructed using ELECTRE MCDA to capture explicit policy preferences, preventing desirable performance in one variable from masking structural deficits in another.

This hybrid multi-criteria conditional approach proves highly transformative in public sector evaluation. In 'Multicriteria ranking for the efficient and effective assessment of police departments' (2021), Professor Daraio and her co-authors combine Conditional Frontier Analysis with PROMETHEE II to evaluate public safety departments in Pernambuco, Brazil, balancing operational resource allocation with crime prevention effectiveness. This empirical framework is further expanded in 'Exogenous crimes and the assessment of public safety efficiency and effectiveness' (2022), which incorporates exogenous property and violent crime rates into conditional directional distance models, demonstrating how external environmental conditions dictate attainable efficiency frontiers for justice units. Extending this multi-criteria directional distance methodology to panel settings, 'Multicriteria panel-data directional distances and the efficiency measurement of multidimensional higher education systems' (2024) models output expansion paths across national higher education systems, accommodating conflicting objectives across teaching, research, and outreach.

## Institutional Efficiency, Unobserved Heterogeneity, and Educational Analytics

Professor Daraio's research into higher education systems examines how internal organizational structures and latent quality factors interact with resource constraints. In 'Quality as a latent heterogeneity factor in the efficiency of universities' (2021), written with L. Simar and P. W. Wilson, advanced non-parametric efficiency techniques and directional distances are applied to isolate an unobserved human capital and managerial quality factor that shifts the production frontier independent of university size and specialization.

Her empirical investigations heavily interrogate the role of non-academic personnel and financial structures. In 'Determinants of the incidence of non-academic staff in European and US HEIs' (2023), nonlinear regression analysis reveals distinct structural relationships between research orientation, university scale, and administrative staffing across European and American institutions. Building on this, 'The role of the non-academic staff heterogeneity in the performance of European universities' (2026) demonstrates that while sheer administrative staff proportions do not directly dictate efficiency, unobserved staff heterogeneity combined with large administrative scale can produce bureaucratic overload unless professional competencies are strategically integrated. Furthermore, 'Heterogeneity of national accounting systems, world-class universities and financial resources: What are the links?' (2024) isolates the strong predictive link between financial resource leverage and Shanghai Ranking tiers, highlighting international accounting incompatibilities. To provide practical benchmarking tools under budget constraints, 'Climbing university rankings under resources constraints: a combined approach integrating DEA and directed Louvain community detection' (2025) integrates non-parametric frontier models with network community detection to establish realistic performance targets for Italian universities. Complementing this, 'A heuristic approach based on Leiden rankings to identify outliers: evidence from Italian universities in the European landscape' (2023) utilizes Leiden ranking heuristics to identify small, emerging research teams driving institutional performance.

## Data Quality, Longitudinal Error Detection, and Completeness-Aware Integration

Recognizing that robust benchmarking models depend critically on underlying data integrity, Professor Daraio has constructed novel architectures for data cleaning, missing value imputation, and completeness modeling. In 'Optimization methods for the imputation of missing values in Educational Institutions Data' (2021), alongside related methodological contributions in 'Imputation techniques for the reconstruction of missing interconnected data from higher Educational Institutions' (2021) and 'Information reconstruction in educational institutions data from the European tertiary education registry' (2021), she presents donor-based and trend-smoothing optimization algorithms capable of reconstructing missing multi-variate time-series sequences within the European Tertiary Education Register (ETER) without distorting inherent variable correlations.

To safeguard longitudinal dataset reliability, 'Flexible Techniques to Detect Typical Hidden Errors in Large Longitudinal Datasets' (2024) formulates mathematical symmetry and difference indicators that automatically filter elusive longitudinal anomalies in higher education administrative records. At the system architecture level, 'Accounting for quality in data integration systems: a completeness-aware integration approach' (2022) introduces an integration framework that maximizes data completeness by design, converting raw data infrastructures into robust knowledge systems. These foundational data processing principles directly underpinned the construction of 'An integrated dataset providing a landscape of the Italian Universities' (2023), which combines Scopus publication metadata, balance sheet figures, and institutional characteristics. To assist users in diagnosing model robustness, 'A visual analytics approach for the assessment of information quality of performance models—a software review' (2022) and 'A visual analytics environment for the assessment of information quality of performance models' (2021) detail visual analytic software designed to identify anomalous data points and minimize manual diagnostic load during performance modeling.

## Virtue-Based Responsible Research Assessment and Responsible Bibliometrics

Addressing the systemic unintended consequences of quantitative research metrics, Professor Daraio has developed alternative, virtue-grounded frameworks for responsible research assessment. In 'UNDERSTANDING RESPONSIBLE RESEARCH ASSESSMENT: A MACINTYREAN PROPOSAL' (2025) and 'Understanding scientific success: A macintyrean virtue ethics approach' (2021), she draws upon Alasdair MacIntyre’s philosophical virtue ethics to critique metric-driven compartmentalization, proposing that assessment must evaluate character virtues and internal practices rather than mere commercial output indicators. This conceptual foundation is operationalized in 'An ontology-based semantic design for good evaluations of research practices' (2021) and 'How should evaluation be? Is a good evaluation of research also just? Towards the implementation of good evaluation' (2022), which construct semantic ontologies and reasoning algorithms to validate questionnaire data probing researchers' ethical motivations.

To bridge policy ideals with institutional reality, 'A framework for the responsible use of bibliometrics in research evaluation' (2026) introduces a prismatic model of research evaluation that structures metric selection according to contextual purpose, unit level, and stakeholder engagement. In 'Operationalising responsible use of bibliometrics in research evaluation insights obtained from policy application of scientometrics at three European universities' (2026), this framework is applied across European institutions, illustrating narrative-based evaluation models and ontology-backed assessment tools at KU Leuven, Sapienza University, and the University of Vienna. Furthermore, 'Research evaluation reform and the heterogeneity of researchers' metric-wiseness' (2025) empirically measures the wide variance in metric literacy and attitudes across academic disciplines, emphasizing that reform adoption hinges on accounting for researcher heterogeneity. This line of inquiry critically evaluates economic metrics in 'Can we estimate a monetary value of scientific publications?' (2021), highlighting the policy pitfalls of financializing academic literature.

## Eco-Efficiency Benchmarking, Circular Economy, and Sustainable Sectoral Policy

Applying non-parametric efficiency techniques to environmental governance, Professor Daraio has established significant lines of research in municipal waste management and energy retail markets. In 'Impact of a regulatory target and external factors on the waste efficiency of Italian municipalities' (2025), she evaluates the 65% national sorted collection mandate across Italian municipalities, showing that meeting regulatory targets enhances cost efficiency as operational expenditures scale. In 'Viable eco-efficiency targets for waste collection communities' (2024), conditional efficiency models and peer-matching algorithms are applied to set viable eco-efficiency targets across 89 municipalities within the metropolitan area of Rome, controlling for local economic development and urban population scale.

On a broader scale, 'A Flexible and Sustainable Analysis of Waste Efficiency at the European Level' (2024) and 'Driving EU sustainability: Promoting the circular economy through municipal waste efficiency' (2024) utilize directional DEA across European Union member states, categorizing national performance into distinct technical, economic, and sustainable circular economy clusters. Extending sustainability benchmarking to energy markets, 'A Framework for the Analysis of the Sustainability of the Energy Retail Market' (2022) formulates a conceptual policy evaluation model, which is empirically applied in 'A robust benchmarking of direct margin in Italy's energy retail markets' (2024) to assess direct margin performance and commercial efficiency among 120 unbundled electricity and gas retailers. To ground sustainability at the institutional level, 'Strategies for developing sustainable communities in higher education institutions' (2023) employs multi-criteria decision analysis to map student perceptions and identify foundational operational pillars for university campus sustainability.

## Physics-Inspired Geopolitical Modeling, AI Synthesis, and Emerging Technologies

Demonstrating exceptional interdisciplinary range, Professor Daraio incorporates methods from statistical physics and modern natural language processing into scientometrics and systematic literature review methodologies. In 'Worldwide bilateral geopolitical interactions network inferred from national disciplinary profiles' (2022), co-authored with M. G. Izzo, L. Leuzzi, G. Quaglia, and G. Ruocco, time series of national publication shares across disciplines are mapped onto an nd-dimensional Heisenberg spin model. By estimating network interaction parameters via a pseudolikelihood maximization approach, the study infers bilateral academic and geopolitical alignment networks across the global fall-of-the-Berlin-Wall boundary.

Addressing the rapid expansion of scientific literature, 'Systematic reviews as a metaknowledge tool: caveats and a review of available options' (2023) evaluates automated literature synthesis tools against domain-expert curation. This is advanced in 'Pitfalls, benefits, and comparative analysis of artificial intelligence ChatBots in the systematic review process' (2026), which provides a comparative case study analyzing the accuracy, efficiency, and trade-offs of deploying conversational AI chatbots across systematic literature review stages. Finally, in 'An Integrated and Flexible Review Framework to Evaluate the Evolution and Barriers of Digital-Twin Technologies in Industrial and Healthcare Domains' (2025), an Integrated Flexible Systematic Review (IFSR) framework is introduced to map technological adoption barriers, real-time analytics capabilities, and interoperability constraints of digital-twin innovations across industrial and clinical healthcare domains.

## Synthesizing Efficiency, Data Integrity, and Governance: Future Trajectories

Professor Cinzia Daraio’s cumulative research program represents a coherent synthesis of mathematical efficiency modeling, rigorous data engineering, and responsible evaluation ethics. By continually expanding non-parametric directional distance functions to handle multi-criteria trade-offs, non-convex cones, and unobserved environmental factors, her work addresses long-standing theoretical gaps in production economics while remaining deeply grounded in real-world administrative data.

Looking forward, her trajectory moves toward fully integrated, semantic, and AI-assisted knowledge environments capable of conducting continuous, responsible performance benchmarking. By harmonizing physics-inspired interaction models, virtue-ethics assessment frameworks, and multi-dimensional eco-efficiency indicators, Professor Daraio continues to shape the international landscape of research evaluation, operations research, and evidence-based policy formulation.

    function parseMD(md) {
      const result = { title: "", bibliometrics: null, themes: [], biography: "" };
      const normalized = md.replace(/\r\n/g, "\n");

      // 1. Extract Author Name
      const titleMatch = normalized.match(/^#\s+(.+)$/m);
      if (titleMatch) {
        result.title = titleMatch[1].replace(/^(Academic\s+)?Narrative\s+CV:\s*/i, "").trim();
      }

      // 2. Extract Bibliometric Overview if present
      const bibMatch = normalized.match(/##\s+Bibliometric Overview([\s\S]*?)(?=\n##|\n---|$)/i);
      if (bibMatch) {
        const bibText = bibMatch[1];
        const pubsMatch = bibText.match(/\*\*Total Publications Analyzed\*\*:\s*([^\n]+)/i);
        const timespanMatch = bibText.match(/\*\*Publication Timespan\*\*:\s*([^\n]+)/i);
        const venuesMatch = bibText.match(/\*\*Unique Journals \/ Venues\*\*:\s*([^\n]+)/i);

        const journals = [];
        const journalLines = bibText.match(/^\s*-\s*\*\*([^*]+)\*\*\s*\(([^)]+)\)/gm);
        if (journalLines) {
          journalLines.forEach(line => {
            const m = line.match(/^\s*-\s*\*\*([^*]+)\*\*\s*\(([^)]+)\)/);
            if (m) {
              journals.push({ name: m[1].trim(), count: m[2].trim() });
            }
          });
        }

        result.bibliometrics = {
          totalPubs: pubsMatch ? pubsMatch[1].trim() : "",
          timespan: timespanMatch ? timespanMatch[1].trim() : "",
          uniqueVenues: venuesMatch ? venuesMatch[1].trim() : "",
          journals: journals
        };
      }

      // 3. Extract Theme Section and Biography Section
      const themeStart = normalized.indexOf("## Thematic Research Areas");
      const hrIndex = normalized.indexOf("\n---\n");

      let themeSection = "";
      let bioSection = "";

      if (themeStart !== -1) {
        if (hrIndex !== -1 && hrIndex > themeStart) {
          themeSection = normalized.slice(themeStart, hrIndex);
          bioSection = normalized.slice(hrIndex + 5);
        } else {
          themeSection = normalized.slice(themeStart);
        }
      } else {
        themeSection = hrIndex !== -1 ? normalized.slice(0, hrIndex) : normalized;
        bioSection = hrIndex !== -1 ? normalized.slice(hrIndex + 5) : "";
      }

      // 4. Parse Themes
      const themeBlocks = themeSection.split(/^###\s+/m).slice(1);
      result.themes = themeBlocks.map(block => {
        const lines = block.split("\n");
        const name = lines[0].trim();
        const rest = lines.slice(1).join("\n");

        const kwMatch = rest.match(/\*\*Keywords\*\*:\s*([^\n]+)/i);
        const pubsMatch = rest.match(/\*\*Key Publications\*\*:\s*\n([\s\S]*?)(?=\n###|\n##|$)/i);

        let description = rest;
        if (kwMatch) {
          description = description.split(/\*\*Keywords\*\*:/i)[0];
        } else if (pubsMatch) {
          description = description.split(/\*\*Key Publications\*\*:/i)[0];
        }
        description = description.trim();

        let keywords = [];
        if (kwMatch) {
          // Split on commas that are outside parentheses
          const raw = kwMatch[1].trim();
          const tokens = [];
          let current = "";
          let depth = 0;
          for (let i = 0; i < raw.length; i++) {
            const char = raw[i];
            if (char === "(") depth++;
            else if (char === ")") depth = Math.max(0, depth - 1);

            if (char === "," && depth === 0) {
              if (current.trim()) tokens.push(current.trim());
              current = "";
            } else {
              current += char;
            }
          }
          if (current.trim()) tokens.push(current.trim());
          keywords = tokens;
        }

        const pubs = pubsMatch
          ? pubsMatch[1].split("\n").map(l => l.replace(/^-\s*/, "").trim()).filter(Boolean)
          : [];

        return { name, description, keywords, pubs };
      });

      // 5. Biography section: remove the leading ## Academic Biography heading if present
      let bioBody = bioSection.replace(/^##\s+Academic Biography\s*\n/m, "").trim();
      result.biography = bioBody;

      return result;
    }

              </div>
            ` : ""}
            ${t.pubs.length > 0 ? `
              <div class="cv-pubs-container">
                <div class="cv-pubs-header">Key Publications (${t.pubs.length}):</div>
                <ul class="cv-pubs-list">
                  ${t.pubs.map(p => `<li>${escHtml(p)}</li>`).join("")}
                </ul>
              </div>
            ` : ""}
          </div>
        `).join("");
      }

      // Render Narrative Biography via marked
      if (typeof marked !== "undefined" && typeof marked.parse === "function") {
        document.getElementById("narrative-body").innerHTML = marked.parse(data.biography || "");
      } else {
        document.getElementById("narrative-body").textContent = data.biography || "";
      }
    }

    function escHtml(str) {
      if (!str) return "";
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Execute render
    render(RAW_MD);
  </script>
</body>
</html>
